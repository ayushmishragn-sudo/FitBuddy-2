<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}FitBuddy – AI Fitness Plan Generator{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css" />
  {% block extra_head %}{% endblock %}
</head>
<body>

  <nav class="navbar">
    <a href="/" class="nav-brand">
      <span class="brand-icon">💪</span>
      <span class="brand-name">FitBuddy</span>
    </a>
    <div class="nav-links">
      <a href="/" class="nav-link {% if request.url.path == '/' %}active{% endif %}">Generate Plan</a>
      <a href="/admin" class="nav-link {% if request.url.path == '/admin' %}active{% endif %}">Admin</a>
    </div>
  </nav>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <p>FitBuddy &copy; 2024 &mdash; Powered by <strong>Google Gemini AI</strong> &amp; <strong>FastAPI</strong></p>
  </footer>

  <script src="/static/js/main.js"></script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
