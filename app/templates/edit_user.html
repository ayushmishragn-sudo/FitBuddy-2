{% extends "base.html" %}
{% block title %}FitBuddy – Edit User{% endblock %}

{% block content %}
<section class="admin-hero">
  <h1>Edit User</h1>
  <p>Update profile details for <strong style="color: var(--clr-white)">{{ user.name }}</strong></p>
</section>

<div class="edit-container container">

  {% if errors %}
  {% for err in errors %}
  <div class="alert alert-error">⚠ {{ err }}</div>
  {% endfor %}
  {% endif %}

  <div class="edit-card">
    <form method="post" action="/admin/user/{{ user.id }}/edit" class="form-grid">

      <div class="field">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" value="{{ user.name }}" required placeholder="e.g. Alex Johnson" />
      </div>

      <div class="field-row">
        <div class="field">
          <label for="age">Age</label>
          <input type="number" id="age" name="age" value="{{ user.age }}" min="10" max="100" required />
        </div>
        <div class="field">
          <label for="weight">Weight (kg)</label>
          <input type="number" id="weight" name="weight" value="{{ user.weight }}" min="20" max="300" step="0.1" required />
        </div>
      </div>

      <div class="field">
        <label>Fitness Goal</label>
        <div class="goal-cards">
          <label class="goal-card">
            <input type="radio" name="goal" value="Weight Loss" {% if user.goal == 'Weight Loss' %}checked{% endif %} required />
            <span class="goal-icon">🔥</span>
            <span class="goal-label">Weight Loss</span>
          </label>
          <label class="goal-card">
            <input type="radio" name="goal" value="Muscle Gain" {% if user.goal == 'Muscle Gain' %}checked{% endif %} />
            <span class="goal-icon">💪</span>
            <span class="goal-label">Muscle Gain</span>
          </label>
          <label class="goal-card">
            <input type="radio" name="goal" value="General Wellness" {% if user.goal == 'General Wellness' %}checked{% endif %} />
            <span class="goal-icon">🧘</span>
            <span class="goal-label">General Wellness</span>
          </label>
        </div>
      </div>

      <div class="field">
        <label>Workout Intensity</label>
        <div class="intensity-selector">
          <label class="intensity-opt low">
            <input type="radio" name="intensity" value="low" {% if user.intensity == 'low' %}checked{% endif %} required />
            <div class="intensity-bar"></div>
            <span class="intensity-label">Low</span>
          </label>
          <label class="intensity-opt medium">
            <input type="radio" name="intensity" value="medium" {% if user.intensity == 'medium' %}checked{% endif %} />
            <div class="intensity-bar"></div>
            <span class="intensity-label">Medium</span>
          </label>
          <label class="intensity-opt high">
            <input type="radio" name="intensity" value="high" {% if user.intensity == 'high' %}checked{% endif %} />
            <div class="intensity-bar"></div>
            <span class="intensity-label">High</span>
          </label>
        </div>
      </div>

      <div class="edit-actions">
        <button type="submit" class="btn-save">Save Changes</button>
        <a href="/admin" class="btn-cancel">Cancel</a>
      </div>

    </form>
  </div>
</div>
{% endblock %}
